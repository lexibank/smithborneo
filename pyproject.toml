[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smithborneo"
version = "1.0"
dependencies = ["pylexibank>=4.2.0"]

[project.optional-dependencies]
test = ["pytest-cldf"]

[project.entry-points."lexibank.dataset"]
smithborneo = "lexibank_smithborneo:Dataset"

[tool.setuptools]
py-modules = ["smithborneo"]
include-package-data = true
zip-safe = false
